version: "3.9"

services:
  api:
    build:
      context: .
      dockerfile: ./apps/api/Dockerfile
    image: cook-me-api:latest   # image locale pour éviter le pull
    container_name: api
    ports:
      - "3001:3001"
    environment:
      MONGODB_URI: mongodb://mongo:27017/CMDB
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      - mongo
      - redis
    volumes:
      - .:/app        # montage du code pour hot-reload
      - /app/node_modules   # éviter d’écraser node_modules installés dans le conteneur

  mongo:
    image: mongo:7.0       # version fixe et stable
    container_name: mongo
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: always
    ports:
      - "6379:6379"

volumes:
  mongo-data:
